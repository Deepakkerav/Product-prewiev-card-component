<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  
  <title>Frontend Mentor | Product preview card component</title>
   <link rel="stylesheet" href="style.css">

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
</head>
<body>
  <main>
  <div class="container">
    <div class="wrapper">
    <div class="image">
      <img src="images/image-product-desktop.jpg" alt="">
    </div>
    <div class="image-text">
      <h6 class="intr">Perfume</h6>
       <p class="name">Gabrielle Essence Eau De Parfum</p>
       <p class="discreaption">A floral, solar and voluptuous interpretation composed by Olivier Polge, 
         Perfumer-Creator for the House of CHANEL.</p>
       <div class="price">
        <p>$149.99</p>
        <del>$169.99</del>
       </div>
       <div class="btn">
      <button><img src="images/icon-cart.svg" alt="shop"><span>Add to Cart</span></button>
     </div>
    </div>
    </div>
  </div>
</main>
</body>
</html>
